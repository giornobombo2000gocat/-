name: scopa
services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/openapi.json', timeout=5).read()"]
      interval: 15s
      timeout: 6s
      start_period: 15s
      retries: 3
    restart: unless-stopped
