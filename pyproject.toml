[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scopa-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.30,<1"]
adapters = ["pydantic>=2.10,<3"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "httpx2>=2.13,<3"]

[tool.setuptools.packages.find]
include = ["engine*", "backend*", "site_adapter*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-ra --import-mode=importlib"
